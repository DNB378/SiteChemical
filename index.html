    <style>
        :root {
            --space-blue: #0a192f;
            --neon-green: #64ffda;
            --atomic-red: #ff2e63;
            --particle-yellow: #f9d71c;
            --gradient-1: linear-gradient(135deg, #0a192f 0%, #172a45 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: var(--gradient-1);
            color: white;
            line-height: 1.6;
            overflow-x: hidden;
        }

        .hero {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

            .hero::before {
                content: '';
                position: absolute;
                width: 200%;
                height: 200%;
                background: radial-gradient(circle, rgba(100,255,218,0.1) 0%, rgba(10,25,47,0) 70%);
                animation: particle-flow 20s linear infinite;
            }

        @keyframes particle-flow {
            0% {
                transform: translate(-50%, -50%);
            }

            100% {
                transform: translate(50%, 50%);
            }
        }

        .hero-content {
            text-align: center;
            z-index: 1;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 4rem;
            text-shadow: 0 0 15px var(--neon-green);
            margin-bottom: 2rem;
            animation: float 3s ease-in-out infinite;
        }

        .periodic-table {
            display: grid;
            grid-template-columns: repeat(18, 1fr);
            gap: 3px;
            max-width: 1200px;
            margin: 2rem auto;
            padding: 1rem;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
        }

        .element {
            position: relative;
            padding: 10px;
            border-radius: 8px;
            background: rgba(255,255,255,0.05);
            transition: all 0.3s ease;
            cursor: pointer;
            min-height: 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            border: 1px solid rgba(100,255,218,0.1);
        }

            .element:hover {
                transform: scale(1.15);
                z-index: 100;
                background: linear-gradient(45deg, #64ffda22, #64ffda44);
                box-shadow: 0 0 25px #64ffda33;
            }

        .atomic-number {
            position: absolute;
            top: 5px;
            left: 5px;
            font-size: 0.8em;
            color: var(--neon-green);
        }

        .symbol {
            font-size: 1.4em;
            font-weight: bold;
            margin: 5px 0;
        }

        .name {
            font-size: 0.7em;
            opacity: 0.8;
            line-height: 1.2;
        }

        .element[data-radioactive="true"] {
            animation: radioactive-glow 2s infinite alternate;
        }

        @keyframes radioactive-glow {
            from {
                box-shadow: 0 0 5px #ff2e63;
            }

            to {
                box-shadow: 0 0 20px #ff2e63;
            }
        }

        .atom-model {
            width: 300px;
            height: 300px;
            position: relative;
            margin: 2rem auto;
        }

        .nucleus {
            width: 30px;
            height: 30px;
            background: var(--atomic-red);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 30px var(--atomic-red);
        }

        .electron {
            position: absolute;
            width: 10px;
            height: 10px;
            background: var(--particle-yellow);
            border-radius: 50%;
            animation: electron-orbit 5s linear infinite;
        }

        @keyframes electron-orbit {
            from {
                transform: rotate(0deg) translateX(100px) rotate(0deg);
            }

            to {
                transform: rotate(360deg) translateX(100px) rotate(-360deg);
            }
        }

        .infographics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            padding: 2rem;
        }

        .info-card {
            background: rgba(255,255,255,0.05);
            padding: 2rem;
            border-radius: 15px;
            transition: transform 0.3s ease;
        }

            .info-card:hover {
                transform: translateY(-10px);
            }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }

            .periodic-table {
                grid-template-columns: repeat(9, 1fr);
            }
        }
    </style>



  <style>
        /* Додаємо нові стилі для тултипу та атома */
        .element-tooltip {
            position: fixed;
            background: var(--space-blue);
            border: 2px solid var(--neon-green);
            padding: 1rem;
            border-radius: 10px;
            max-width: 300px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 1000;
            box-shadow: 0 0 20px rgba(100,255,218,0.3);
        }

        .live-atom {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 1rem auto;
        }

        .live-nucleus {
            width: 20px;
            height: 20px;
            background: var(--atomic-red);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 15px var(--atomic-red);
        }

        .live-electron {
            position: absolute;
            width: 8px;
            height: 8px;
            background: var(--particle-yellow);
            border-radius: 50%;
            transform-origin: 50% 50%;
        }

        /* Виправлення анімації електронів */
        @keyframes electron-orbit {
            0% { transform: rotate(0deg) translateX(50px) rotate(0deg); }
            100% { transform: rotate(360deg) translateX(50px) rotate(-360deg); }
        }

        /* Вирівнювання ядра */
        .nucleus {
            animation: nucleus-float 4s ease-in-out infinite;
        }

        @keyframes nucleus-float {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.05); }
        }
    </style>
    
</head>

    <script>
        // Додаємо тултип та обробники подій
        const tooltip = document.createElement('div');
        tooltip.className = 'element-tooltip';
        document.body.appendChild(tooltip);

        // Оновлюємо створення елементів таблиці
        elements.forEach(element => {
            const el = document.createElement('div');
            el.className = 'element';
            el.innerHTML = `
                <div class="atomic-number">${element.atomicNumber}</div>
                <div class="symbol">${element.symbol}</div>
                <div class="name">${element.name}</div>
            `;

            // Додаємо обробники подій для тултипу та атома
            el.addEventListener('mouseenter', (e) => {
                const rect = e.target.getBoundingClientRect();
                tooltip.style.left = `${rect.left + rect.width/2}px`;
                tooltip.style.top = `${rect.top - 20}px`;
                tooltip.style.opacity = '1';
                tooltip.innerHTML = `
                    <h3>${element.name}</h3>
                    <p>Атомний номер: ${element.atomicNumber}</p>
                    <div class="live-atom" id="live-atom-${element.atomicNumber}"></div>
                `;
                
                // Генеруємо модель атома
                generateLiveAtom(element.atomicNumber);
            });

            el.addEventListener('mouseleave', () => {
                tooltip.style.opacity = '0';
            });

            periodicTable.appendChild(el);
        });

        // Функція для генерації атома
        function generateLiveAtom(atomicNumber) {
            const container = tooltip.querySelector('.live-atom');
            container.innerHTML = '';
            
            // Створюємо ядро
            const nucleus = document.createElement('div');
            nucleus.className = 'live-nucleus';
            container.appendChild(nucleus);

            // Створюємо електрони
            const electronsCount = Math.min(atomicNumber, 8); // Обмеження для візуалізації
            const orbitRadius = [40, 60]; // Радіуси орбіт
            
            for(let i = 0; i < electronsCount; i++) {
                const electron = document.createElement('div');
                electron.className = 'live-electron';
                const orbit = i % 2 === 0 ? 0 : 1;
                const angle = (360 / (electronsCount/2)) * (i % (electronsCount/2));
                electron.style.transform = `rotate(${angle}deg) translateX(${orbitRadius[orbit]}px)`;
                electron.style.animation = `electron-orbit ${4 + orbit*2}s linear infinite`;
                container.appendChild(electron);
            }
        }

        // Виправлення анімації оригінального атома
        document.querySelectorAll('.electron').forEach((el, i) => {
            el.style.animation = `electron-orbit ${5 + i*2}s linear infinite`;
        });
    </script>

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('show');
                }
            });
        }, { threshold: 0.1 });

        const quizData = [
            {
                question: "Який елемент має символ 'Au'?",
                options: ["Золото", "Срібло", "Аргон"],
                correct: 0,
                fact: "Золото - один з найменш хімічно активних металів!"
            },
            {
                question: "Який елемент найлегший у періодичній таблиці?",
                options: ["Гелій", "Водень", "Літій"],
                correct: 1,
                fact: "Водень складає ~75% маси Всесвіту!"
            },
            {
                question: "Який метал рідкісний при кімнатній температурі?",
                options: ["Залізо", "Ртуть", "Алюміній"],
                correct: 1,
                fact: "Ртуть - єдиний метал, рідкий за кімнатної температури"

        function initializeQuiz() {
            quizContainer.innerHTML = '';
            quizContainer.appendChild(scoreDisplay);
            showQuestion();
        }

        function showQuestion() {
            const q = quizData[currentQuestion];
            const questionEl = document.createElement('div');
            questionEl.className = `question ${currentQuestion === 0 ? 'active' : ''}`;
            questionEl.innerHTML = `
                    <h3>${currentQuestion + 1}. ${q.question}</h3>
                    <div class="options-container">
                        ${q.options.map((opt, i) => `
                            <button class="quiz-option"
                                    onclick="checkAnswer(${currentQuestion}, ${i})"
                                    data-correct="${i === q.correct}">
                                ${opt}
                            </button>
                        `).join('')}
                    </div>
                    <div class="quiz-fact">${q.fact}</div>
                `;
            quizContainer.appendChild(questionEl);
            updateScore();
        }

        function checkAnswer(questionIndex, selectedIndex) {
            const options = document.querySelectorAll('.quiz-option');
            const correctIndex = quizData[questionIndex].correct;
            let isCorrect = selectedIndex === correctIndex;

            options.forEach((option, index) => {
                option.disabled = true;
                if (index === correctIndex) {
                    option.classList.add('correct');
                }
                if (index === selectedIndex && !isCorrect) {
                    option.classList.add('incorrect');
                }
            });

            if (isCorrect) {
                score += 25;
                showConfetti();
            }

            updateScore();

            setTimeout(() => {
                currentQuestion++;
                if (currentQuestion < quizData.length) {
                    showQuestion();
                } else {
                    showFinalResults();
                }
            }, 2000);
        }

        function updateScore() {
            scoreDisplay.innerHTML = `🏆 Поточний рахунок: ${score} балів`;
        }

        function showFinalResults() {
            quizContainer.innerHTML = `
                    <div class="final-results">
                        <h2>🎉 Тест завершено!</h2>
                        <div class="final-score">Ваш результат: ${score}/100</div>
                        <div class="performance-message">
                            ${score === 100 ? 'Ідеально! Ви справжній хімік! 🔬' :
                    score >= 75 ? 'Чудовий результат! Практикуйтесь ще! ⚗️' :
                        'Непогано, але можна краще! Повторіть матеріал! 📚'}
                        </div>
                        <button onclick="restartQuiz()" class="restart-btn">Спробувати ще раз 🔁</button>
                    </div>
                `;
        }

        function showConfetti() {
            const confetti = document.createElement('div');
            confetti.className = 'confetti';
            confetti.innerHTML = '🎊';
            document.body.appendChild(confetti);
            setTimeout(() => confetti.remove(), 1000);
        }

        function restartQuiz() {
            currentQuestion = 0;
            score = 0;
            initializeQuiz();
        }

        initializeQuiz();
    </script>
